# Builds the Android app (Trusted Web Activity) from the live site with Google's Bubblewrap.
# Start it by hand: Actions → Android app → Run workflow. Needs GitHub Actions to be unlocked (billing).
# Secrets (Settings → Secrets → Actions): ANDROID_KEYSTORE_B64 (base64 of the .keystore file),
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD. Without them it makes a TEST build with a throw-away key.
name: Android app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bubblewrap
        run: |
          npm i -g @bubblewrap/cli@1
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android.keystore; echo "REAL=1" >> $GITHUB_ENV
          else
            keytool -genkeypair -keystore android.keystore -alias viralkaro -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testtest -keypass testtest -dname "CN=ViralKaro test build"
            echo "::warning::No signing secrets – this is a TEST build. Use your permanent key for the Play Store."
          fi
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'testtest' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'testtest' }}
        run: |
          cd android
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
          keytool -list -v -keystore android.keystore -alias viralkaro -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep SHA256: | head -1 > fingerprint.txt
          cat fingerprint.txt
      - uses: actions/upload-artifact@v4
        with:
          name: viralkaro-android
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
            android/fingerprint.txt
