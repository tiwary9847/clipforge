name = "clipforge-pay"
main = "worker.js"
compatibility_date = "2026-11-01"

# create it with: npx wrangler kv namespace create DB   → paste the id here
[[kv_namespaces]]
binding = "DB"
id = "PASTE_KV_ID_HERE"

[vars]
ALLOWED_ORIGINS = "https://tiwary9847.github.io"
AI_MONTHLY = "300"

# Secrets (set with: npx wrangler secret put NAME) – never put them in this file:
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, LICENCE_PRIVATE_JWK, GEMINI_KEY,
#   ADMIN_TOKEN (a long password for the seller dashboard at /clipforge/admin.html),
#   PLAY_SERVICE_ACCOUNT, PLAY_PACKAGE (only for the Play Store app)
